[package]
name = "transaction-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
# http framework
axum = "0.7"

# time
chrono = { version = "0.4", features = ["serde"] }

redis = "1.6.0"

# serialization
serde = "1"
serde_json = "1"

sqlx = "0.9.0"

# async runtime
tokio = { version = "1", features = ["full"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid = { version = "1", features = ["v4", "serde"] }
